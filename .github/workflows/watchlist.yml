name: Watchlist Robot

on:
  schedule:
    - cron: "30 1 * * *"     # every day 7:00 AM India time (01:30 UTC)
  workflow_dispatch:          # "Run workflow" button in GitHub (also works in the GitHub phone app)
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: auto
        options:
          - auto       # daily steps, + monthly review if today is the 1st
          - daily      # only Steps 1-4
          - monthly    # only the fundamental review of SP and DT
          - list       # just send me the full SP and DT list on Telegram

permissions:
  contents: write   # save the updated watchlists
  pages: write      # publish the dashboard
  id-token: write   # needed by GitHub Pages publishing

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run robot
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py ${{ github.event.inputs.mode || 'auto' }}

      - name: Save updated watchlists
        run: |
          git config user.name "watchlist-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Watchlist update $(TZ=Asia/Kolkata date +'%d %b %Y')"
          git push

      - name: Prepare dashboard for publishing
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
