# ============================================================
#  FUNDAMENTAL MARKS — Sacheen's TechnoFunda system
# ============================================================
#
#  Full system = 11 marks:
#     1. Business         2    ✅ automatic when extra_marks: on  (ROE & ROCE vs 4-quarter average)
#     2. P&L Statement    3    ✅ automatic
#     3. Balance Sheet    1.5  ✅ automatic
#     4. Management       1    ✅ automatic when extra_marks: on  (promoter, cash from operations)
#     5. Holding pattern  1.5  ✅ automatic
#     6. Future           2    ✅ automatic when extra_marks: on  (TTM profit growth, TTM PEG)
#                              + 1 mark management outlook (1 year) from PPT / concall: checked by Claude on request
#
#  The robot calculates the 6 automatic marks from Screener.in:
#
#   q_sales_growth  Latest quarter sales growth (vs same quarter last year)
#                   >= 0.8 × TTM sales growth
#   q_eps           Latest quarter EPS >= 0.8 × previous quarter EPS
#   margin          Latest quarter OPM >= average OPM of the 4 quarters before it
#                   (half-yearly SME results: the 2 half-years before it)
#                   (up to "margin_tolerance_pct" % below the average counts as stable)
#   fixed_assets    Fixed assets + CWIP now >= previous balance sheet
#                   (a fall of up to "stable_tolerance_pct" counts as stable)
#   receivables     Receivables < 0.5 × Revenue  (Debtor days below 182.5)
#   fii_dii         FII % + DII % increased vs previous shareholding period
#   shareholders    Number of shareholders decreased or stable
#                   (a rise of up to "stable_tolerance_pct" counts as stable)
#
#  SME companies that report half-yearly are handled automatically
#  (they are compared with the same half of last year).
#  A check with no data from Screener gets 0 marks.
# ============================================================

# Marks for each automatic check (put 0 to switch a check off)
auto_marks:
  q_sales_growth: 1
  q_eps: 1
  margin: 1
  fixed_assets: 1
  receivables: 0.5
  fii_dii: 1
  shareholders: 0.5
  # Business / Management / Future (used when extra_marks: on)
  business_roe_roce: 2      # latest quarter ROE AND ROCE both >= 85% of their previous 4-quarter average
  promoter: 0.5             # promoter holding >= promoter_min
  cfo_3y: 0.5               # cash from operations (3 years) >= cfo_profit_min_pct of net profit (3 years)
  ttm_profit_growth: 0.5    # TTM profit growth >= ttm_profit_growth_min
  ttm_peg: 0.5              # P/E / TTM profit growth <= peg_max
  outlook: 1                # management outlook (1 year) from PPT / concall / announcements, checked by Claude on request
                            # (data/outlook.json, valid ~90 days); a stock not checked yet: this mark is left out

# Business / Management / Future checks:
#   preview = the next run checks every SP / DT stock with them once and sends you the result (nothing removed)
#   on      = they count in the marks (new stocks and the monthly review)
#   off     = not used
extra_marks: "on"          # switched on 7 Nov 2026 after the preview (307 stocks: 289 pass). Keep the quotes.
extra_rules:
  return_tolerance_pct: 15      # ROE / ROCE may be up to 15% below the 4-quarter average
  promoter_min: 45              # %
  cfo_profit_min_pct: 50        # % of net profit, over the last 3 years
  ttm_profit_growth_min: 25     # %
  peg_max: 1

# Pass marks — out of your full system of 11 marks.
# The robot applies the same percentage to the marks it can check:
#   The score shown (on the 11 scale, rounded to 0.1) must be at least the pass mark:
#   5.0/11  = 3 out of the 6 basic marks (extra_marks: off / preview)
#           = 4.5 out of 10 when extra_marks: on (stock without an outlook check)  -> shown 5.0/11
#           = 5 out of 11 when the stock has an outlook check
full_marks: 11
new_stock_pass: 5        # Step 2 — new stock from emails needs this shown score to enter SP
new_stock_min_profit_growth: 20   # Step 2 — and TTM profit growth of at least this % (0 = off; rule of 11 Nov 2026)
# Relative Strength (RS) rating 1-99 vs all BSE stocks. Only the 3-month RS is used (8 Nov 2026); 0 = that check is off.
new_stock_min_rs: 0      # Step 2 — 12-month RS (3/6/9/12 months, last 3 counted double): off
new_stock_min_rs3: 80    # Step 2 — new stock's 3-month RS (last 3 months only) must be above this
monthly_pass: 5          # Step 5 — stock in SP/DT needs this shown score to stay
monthly_min_profit_growth: 20     # Step 5 — SP / DT stock with TTM profit growth below this % is removed (0 = off)
profit_growth_qtr_exception: 35   # ... unless its latest quarter profit growth (vs same quarter last year) is above this % (0 = no exception)
monthly_min_rs: 0        # Step 5 — 12-month RS: off
monthly_min_rs3: 80      # Step 5 — 3-month RS must be above this to stay
monthly_rs_lists: [SP]   # which lists the monthly RS check removes from (DT not checked: its stocks are below the 200 EMA)

# What counts as "stable"
stable_tolerance_pct: 2      # fixed assets / shareholders may move 2% the wrong way
margin_tolerance_pct: 15     # OPM may be up to 15% below the 4-quarter average (avg 10.5% -> needs 8.93%)

# If Screener page can't be opened at all during the monthly check:
#   keep = keep the stock and tell me   |   remove = remove it
page_missing_monthly: keep
